<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | ROVY STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #f4f6f9; color: #333; }
        
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #171717; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; }
        .login-box h2 { margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px; text-align: center; font-size: 18px; letter-spacing: 2px; }
        .login-box button { width: 100%; padding: 12px; background: #b58a61; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }

        #adminPanel { display: none; }
        header { background: #171717; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; }
        .logo span { color: #b58a61; }
        .container { padding: 30px 5%; display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { font-size: 20px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; }
        .btn { background: #b58a61; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f9f9f9; font-weight: bold; }
        .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        
        .order-card { border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        
        /* تنسيق حالة الطلب */
        .status-select { padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; border: 1px solid #ccc; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-shipped { background: #cce5ff; color: #004085; }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }

        .order-items-list { margin-top: 15px; background: white; padding: 10px; border-radius: 5px; border: 1px dashed #ccc; }
        .order-item-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 5px; border-bottom: 1px solid #f1f1f1; padding-bottom: 5px; }
        .order-item-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .order-item-img { width: 30px; height: 30px; border-radius: 3px; object-fit: cover; margin-left: 10px; }
        
        .logout-btn { background: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 5px 15px; border-radius: 5px; cursor: pointer; text-decoration: none; margin-right: 15px; }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>تسجيل الدخول للإدارة</h2>
            <input type="password" id="adminPass" placeholder="أدخل كلمة المرور">
            <button onclick="checkPassword()">دخول</button>
            <p id="loginError" style="color:red; margin-top:10px; display:none;">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div id="adminPanel">
        <header>
            <div class="logo">ROVY<span>.</span> ADMIN</div>
            <div>
                <a href="index.html" style="color: white; text-decoration: none;">زيارة الموقع &larr;</a>
                <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
            </div>
        </header>

        <div class="container">
            <div class="card">
                <h2>إضافة منتج جديد</h2>
                <form id="addProductForm">
                    <div class="form-group">
                        <label>اسم المنتج</label>
                        <input type="text" id="pName" required>
                    </div>
                    <div class="form-group">
                        <label>السعر (جنيه)</label>
                        <input type="number" id="pPrice" required>
                    </div>
                    <div class="form-group">
                        <label>رابط الصورة (URL)</label>
                        <input type="url" id="pImage" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>القسم</label>
                        <select id="pCategory">
                            <option value="Women">نساء</option>
                            <option value="Men">رجال</option>
                            <option value="Kids">أطفال</option>
                            <option value="Sports">رياضة</option>
                            <option value="Accessories">إكسسوارات</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">إضافة المنتج</button>
                </form>
            </div>

            <div>
                <div class="card">
                    <h2>المنتجات الحالية</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>الصورة</th>
                                <th>الاسم</th>
                                <th>السعر</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductsList"></tbody>
                    </table>
                </div>

                <div class="card">
                    <h2>أحدث الطلبات</h2>
                    <div id="ordersList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'Rovy@2026'; 

        function checkPassword() {
            const pass = document.getElementById('adminPass').value;
            if(pass === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadAdminProducts();
                loadOrders();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() { location.reload(); }

        const SUPABASE_URL = 'https://bkjwfmjxmxgxgaxwrnsh.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_3nR3DUDrxahFNVH1j62Uow_YPexuzwb';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadAdminProducts() {
            const { data } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
            const list = document.getElementById('adminProductsList');
            list.innerHTML = '';
            if(data) {
                data.forEach(p => {
                    list.innerHTML += `
                        <tr>
                            <td><img src="${p.image_url}" class="product-img"></td>
                            <td>${p.name}</td>
                            <td>${p.price} ج</td>
                            <td><button class="delete-btn" onclick="deleteProduct(${p.id})">حذف</button></td>
                        </tr>
                    `;
                });
            }
        }

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'جاري الإضافة...';
            btn.disabled = true;

            const { error } = await supabaseClient.from('products').insert([{ 
                name: document.getElementById('pName').value, 
                price: document.getElementById('pPrice').value, 
                image_url: document.getElementById('pImage').value, 
                category: document.getElementById('pCategory').value 
            }]);
            
            if(error) alert('حدث خطأ: ' + error.message);
            else { alert('تمت الإضافة!'); e.target.reset(); loadAdminProducts(); }
            
            btn.innerText = 'إضافة المنتج';
            btn.disabled = false;
        });

        async function deleteProduct(id) {
            if(!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            await supabaseClient.from('products').delete().eq('id', id);
            loadAdminProducts();
        }

        // جلب الطلبات مع تفاصيل المنتجات
        async function loadOrders() {
            // بنجيب الطلب ومعاه جدول الـ order_items ومعاه جدول المنتجات عشان نعرف اسم المنتج وصورته
            const { data, error } = await supabaseClient
                .from('orders')
                .select(`
                    *,
                    order_items (
                        quantity,
                        price,
                        products (name, image_url)
                    )
                `)
                .order('id', { ascending: false });

            const list = document.getElementById('ordersList');
            list.innerHTML = '';

            if(data && data.length > 0) {
                data.forEach(order => {
                    // تحديد لون الحالة
                    let statusClass = 'status-pending';
                    if(order.status === 'shipped') statusClass = 'status-shipped';
                    if(order.status === 'delivered') statusClass = 'status-delivered';
                    if(order.status === 'cancelled') statusClass = 'status-cancelled';

                    // تجهيز قائمة المنتجات داخل الطلب
                    let itemsHtml = '';
                    if(order.order_items) {
                        order.order_items.forEach(item => {
                            const pName = item.products ? item.products.name : 'منتج محذوف';
                            const pImg = item.products ? item.products.image_url : '';
                            itemsHtml += `
                                <div class="order-item-row">
                                    <div style="display:flex; align-items:center;">
                                        <img src="${pImg}" class="order-item-img">
                                        <span>${pName} <strong>(x${item.quantity})</strong></span>
                                    </div>
                                    <span>${item.price * item.quantity} ج</span>
                                </div>
                            `;
                        });
                    }

                    list.innerHTML += `
                        <div class="order-card">
                            <div class="order-header">
                                <strong>طلب رقم #${order.id}</strong>
                                <select class="status-select ${statusClass}" onchange="updateOrderStatus(${order.id}, this.value)">
                                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>قيد الانتظار (Pending)</option>
                                    <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>تم الشحن (Shipped)</option>
                                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>تم التوصيل (Delivered)</option>
                                    <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>ملغي (Cancelled)</option>
                                </select>
                            </div>
                            <p><strong>الاسم:</strong> ${order.customer_name}</p>
                            <p><strong>الموبايل:</strong> ${order.customer_phone}</p>
                            <p><strong>العنوان:</strong> ${order.customer_address}</p>
                            
                            <div class="order-items-list">
                                <p style="font-size:12px; margin-bottom:5px; color:#888;">المنتجات المطلوبة:</p>
                                ${itemsHtml}
                            </div>

                            <p style="margin-top: 15px; font-weight: bold; color: #b58a61; text-align:left;">الإجمالي: ${order.total_price} جنيه</p>
                        </div>
                    `;
                });
            } else {
                list.innerHTML = '<p style="color:#888;">لا توجد طلبات حتى الآن.</p>';
            }
        }

        // تغيير حالة الطلب
        async function updateOrderStatus(orderId, newStatus) {
            const { error } = await supabaseClient
                .from('orders')
                .update({ status: newStatus })
                .eq('id', orderId);
            
            if(error) {
                alert('حدث خطأ أثناء تحديث الحالة');
                console.error(error);
            } else {
                loadOrders(); // إعادة تحميل الطلبات عشان اللون يتغير
            }
        }
    </script>
</body>
</html>
