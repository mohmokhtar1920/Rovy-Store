<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي | ROVY STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}body{margin:0;background:#f8f7f5;color:#222;min-height:100vh;display:flex;flex-direction:column}
header{height:76px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 6%}
.logo{font-size:27px;font-weight:900;letter-spacing:2px;color:#222;text-decoration:none}.logo span{color:#b58a61}
.back{color:#777;text-decoration:none;font-size:14px}.lang-btn{padding:8px 15px;background:transparent;border:1px solid #ddd;border-radius:20px;cursor:pointer;font-weight:bold;font-family:inherit}.page{flex:1;display:flex;justify-content:center;align-items:center;padding:35px 16px}
.auth-card{width:100%;max-width:460px;background:#fff;border:1px solid #eee;border-radius:20px;padding:32px;box-shadow:0 15px 45px rgba(0,0,0,.07)}
.brand-icon{width:58px;height:58px;border-radius:18px;background:#f5eee7;color:#a77b53;display:grid;place-items:center;font-size:24px;margin:0 auto 15px}
h1{text-align:center;font-size:25px;margin:0 0 7px;font-weight:900}.subtitle{text-align:center;color:#888;font-size:13px;margin:0 0 25px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f5f5f5;padding:5px;border-radius:11px;margin-bottom:22px}
.tabs button{border:0;background:transparent;padding:10px;border-radius:8px;color:#777;font-weight:700;cursor:pointer}
.tabs button.active{background:#fff;color:#a77b53;box-shadow:0 2px 8px #0000000d}
.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input{width:100%;padding:13px 14px;border:1px solid #e2e2e2;border-radius:10px;font-size:14px;outline:none;direction:rtl}
.field input:focus{border-color:#b58a61;box-shadow:0 0 0 3px #b58a611c}
.submit{width:100%;border:0;border-radius:10px;background:#171717;color:#fff;padding:14px;font-size:15px;font-weight:900;cursor:pointer;margin-top:5px;transition:.2s}
.submit:hover{background:#b58a61}.submit:disabled{opacity:.6;cursor:wait}
.notice{display:none;margin-top:15px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.7}
.notice.error{display:block;background:#fff0f0;color:#a32929;border:1px solid #f0d0d0}
.notice.success{display:block;background:#eef8f1;color:#267044;border:1px solid #d4eadb}
.account-panel{display:none;text-align:center}.account-email{color:#777;font-size:14px;direction:ltr;margin:10px 0 20px}
.account-actions{display:grid;gap:10px}.secondary{display:block;text-align:center;padding:12px;border:1px solid #e5ddd5;border-radius:10px;color:#8b6849;text-decoration:none;font-weight:700}
@media(max-width:480px){.auth-card{padding:25px 20px}.page{align-items:flex-start;padding-top:28px}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">ROVY<span>.</span></a><div style="display:flex;align-items:center;gap:14px"><button class="lang-btn" id="authLangBtn" type="button" onclick="toggleAuthLanguage()">English</button><a class="back" id="authBack" href="index.html"><i class="fas fa-arrow-right"></i> العودة للمتجر</a></div></header>
<main class="page">
<section class="auth-card" id="authCard">
<div class="brand-icon"><i class="fas fa-user-lock"></i></div>
<h1>أهلاً بك في ROVY</h1>
<p class="subtitle">سجّل دخولك أو أنشئ حساباً لمتابعة طلباتك وإتمام الشراء.</p>
<div class="tabs" id="authTabs"><button type="button" class="active" id="loginTab">تسجيل الدخول</button><button type="button" id="signupTab">إنشاء حساب</button></div>
<form id="authForm">
<div class="field" id="nameField" style="display:none"><label for="fullName">الاسم بالكامل</label><input id="fullName" type="text" autocomplete="name" placeholder="اكتب اسمك"></div>
<div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="email" placeholder="name@example.com" dir="ltr"></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password" placeholder="8 أحرف على الأقل" dir="ltr"></div>
<button class="submit" id="submitBtn" type="submit">تسجيل الدخول</button>
</form>
<div class="notice" id="notice" role="status"></div>
<div id="otpPanel" style="display:none;margin-top:18px">
 <div class="field"><label for="emailOtp">كود التأكيد المكوّن من 8 أرقام</label><input id="emailOtp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" placeholder="00000000" dir="ltr"></div>
 <button class="submit" id="verifyOtpBtn" type="button">تأكيد البريد الإلكتروني</button>
 <button class="secondary" id="resendOtpBtn" type="button" style="width:100%;margin-top:10px;background:#fff">إعادة إرسال الكود</button>
 <button class="secondary" id="changePendingEmailBtn" type="button" style="width:100%;margin-top:10px;background:#fff">استخدام بريد إلكتروني آخر</button>
</div>
</section>
<section class="auth-card account-panel" id="accountPanel">
<div class="brand-icon"><i class="fas fa-user-check"></i></div>
<h1>حسابك جاهز</h1>
<p class="subtitle">أنت مسجل الدخول حالياً في ROVY STORE.</p>
<div id="accountName"></div><div class="account-email" id="accountEmail"></div>
<div class="account-actions"><a class="submit" id="continueLink" href="index.html">متابعة التسوق</a><button class="secondary" id="signOutBtn" type="button">تسجيل الخروج</button></div>
</section>
</main>
<script>
const SUPABASE_URL='https://bkjwfmjxmxgxgaxwrnsh.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_3nR3DUDrxahFNVH1j62Uow_YPexuzwb';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'sb-bkjwfmjxmxgxgaxwrnsh-auth-token'}});
const $=id=>document.getElementById(id);
let english=localStorage.getItem('rovyLanguage')==='en';
let mode='login';
const PENDING_EMAIL_KEY='rovyPendingSignupEmail';
let pendingSignupEmail=localStorage.getItem(PENDING_EMAIL_KEY)||sessionStorage.getItem(PENDING_EMAIL_KEY)||'';
if(pendingSignupEmail)localStorage.setItem(PENDING_EMAIL_KEY,pendingSignupEmail);
const params=new URLSearchParams(location.search);
const requestedNext=params.get('next')||'index.html';
const nextPage=requestedNext==='checkout.html'?'checkout.html':'index.html';

function setNotice(message,type='error'){const n=$('notice');n.className='notice '+type;n.textContent=message;}

function toggleAuthLanguage(){
 english=!english;
 localStorage.setItem('rovyLanguage',english?'en':'ar');
 applyAuthLanguage();
}
function applyAuthLanguage(){
 document.documentElement.lang=english?'en':'ar';
 document.documentElement.dir=english?'ltr':'rtl';
 $('authLangBtn').textContent=english?'العربية':'English';
 document.title=english?'My Account | ROVY STORE':'حسابي | ROVY STORE';
 $('authBack').innerHTML=english?'<i class="fas fa-arrow-left"></i> Back to Store':'<i class="fas fa-arrow-right"></i> العودة للمتجر';
 $('authBack').style.direction=english?'ltr':'rtl';
 $('authCard').querySelector('h1').textContent=english?'Welcome to ROVY':'أهلاً بك في ROVY';
 $('authCard').querySelector('.subtitle').textContent=english?'Sign in or create an account to track your orders and shop.':'سجّل دخولك أو أنشئ حساباً لمتابعة طلباتك وإتمام الشراء.';
 $('loginTab').textContent=english?'Sign In':'تسجيل الدخول';
 $('signupTab').textContent=english?'Create Account':'إنشاء حساب';
 $('fullName').previousElementSibling.textContent=english?'Full Name':'الاسم بالكامل';
 $('fullName').placeholder=english?'Enter your name':'اكتب اسمك';
 $('email').previousElementSibling.textContent=english?'Email Address':'البريد الإلكتروني';
 $('password').previousElementSibling.textContent=english?'Password':'كلمة المرور';
 $('password').placeholder=english?'At least 8 characters':'8 أحرف على الأقل';
 $('emailOtp').previousElementSibling.textContent=english?'8-digit verification code':'كود التأكيد المكوّن من 8 أرقام';
 $('verifyOtpBtn').textContent=english?'Verify Email':'تأكيد البريد الإلكتروني';
 $('resendOtpBtn').textContent=english?'Resend Code':'إعادة إرسال الكود';
 $('changePendingEmailBtn').textContent=english?'Use a different email':'استخدام بريد إلكتروني آخر';
 $('accountPanel').querySelector('h1').textContent=english?'Your Account is Ready':'حسابك جاهز';
 $('accountPanel').querySelector('.subtitle').textContent=english?'You are currently signed in to ROVY STORE.':'أنت مسجل الدخول حالياً في ROVY STORE.';
 $('continueLink').textContent=english?'Continue Shopping':'متابعة التسوق';
 $('signOutBtn').textContent=english?'Sign Out':'تسجيل الخروج';
 setMode(mode);
}
function setMode(next){
 mode=next;
 $('loginTab').classList.toggle('active',mode==='login');
 $('signupTab').classList.toggle('active',mode==='signup');
 $('nameField').style.display=mode==='signup'?'block':'none';
 $('password').autocomplete=mode==='signup'?'new-password':'current-password';
 $('password').placeholder=mode==='signup'?(english?'At least 8 characters':'8 أحرف على الأقل'):(english?'Enter your password':'اكتب كلمة المرور');
 $('submitBtn').textContent=mode==='signup'?(english?'Create Account':'إنشاء حساب جديد'):(english?'Sign In':'تسجيل الدخول');
 $('notice').className='notice';$('notice').textContent='';
}
function showAccount(user){
 $('authCard').style.display='none';$('accountPanel').style.display='block';
 $('accountName').textContent=user.user_metadata?.full_name||(english?'Welcome':'مرحباً بك');
 $('accountEmail').textContent=user.email||'';
 $('continueLink').href=nextPage;
}
function clearPendingSignup(){sessionStorage.removeItem(PENDING_EMAIL_KEY);localStorage.removeItem(PENDING_EMAIL_KEY);pendingSignupEmail='';}
function redirectAfterAuth(){clearPendingSignup();localStorage.removeItem('rovyAuthNext');location.replace(nextPage);}
async function checkSession(){
 const {data,error}=await supabaseClient.auth.getSession();
 if(error){setNotice(english?'Could not verify your session. Refresh the page and try again.':'تعذر التحقق من الجلسة. حدّث الصفحة وحاول مرة أخرى.');return;}
 if(data.session){
   clearPendingSignup();
   if(nextPage==='checkout.html') redirectAfterAuth();
   else showAccount(data.session.user);
 }else if(pendingSignupEmail){
   $('authForm').style.display='none';
   $('otpPanel').style.display='block';
   setNotice(english?'Enter the 8-digit code sent to '+pendingSignupEmail:'أدخل كود التأكيد المكوّن من 8 أرقام المرسل إلى '+pendingSignupEmail,'success');
 }
}
$('loginTab').addEventListener('click',()=>setMode('login'));
$('signupTab').addEventListener('click',()=>setMode('signup'));
$('authForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const btn=$('submitBtn');btn.disabled=true;
 const email=$('email').value.trim().toLowerCase();
 const password=$('password').value;
 try{
  if(mode==='signup'){
   const fullName=$('fullName').value.trim();
   if(fullName.length<2)throw new Error('اكتب اسمك بالكامل قبل إنشاء الحساب.');
   if(password.length<8)throw new Error('كلمة المرور لازم تكون 8 أحرف على الأقل.');
   const redirectTo=location.origin+location.pathname+'?next='+encodeURIComponent(nextPage);
   const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:fullName},emailRedirectTo:redirectTo}});
   if(error)throw error;
   if(data.session){setNotice('تم إنشاء حسابك بنجاح. جاري تحويلك...', 'success');setTimeout(redirectAfterAuth,700);}
   else {
     pendingSignupEmail=email;
     localStorage.setItem(PENDING_EMAIL_KEY,email);
     sessionStorage.setItem(PENDING_EMAIL_KEY,email);
     $('authForm').style.display='none';
     $('otpPanel').style.display='block';
     setNotice('تم إنشاء الحساب. أدخل كود التأكيد المكوّن من 8 أرقام الذي أرسلناه إلى بريدك الإلكتروني.','success');
   }
  }else{
   const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
   if(error)throw error;
   if(data.session)redirectAfterAuth();
  }
 }catch(err){
  let message=err.message||'تعذر إتمام العملية. حاول مرة أخرى.';
  if(/invalid login credentials/i.test(message))message='البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if(/email not confirmed/i.test(message))message=english?'Please confirm your email using the message we sent you.':'أكد بريدك الإلكتروني من الرسالة التي أرسلناها لك أولاً.';
  setNotice(message,'error');
 }finally{btn.disabled=false;}
});
$('verifyOtpBtn').addEventListener('click',async()=>{
  const token=$('emailOtp').value.trim();
  if(!/^\d{8}$/.test(token)){setNotice(english?'Enter the 8-digit verification code.':'اكتب كود التأكيد المكوّن من 8 أرقام.');return;}
  const btn=$('verifyOtpBtn');btn.disabled=true;
  try{
    const {data,error}=await supabaseClient.auth.verifyOtp({email:pendingSignupEmail,token,type:'signup'});
    if(error)throw error;
    clearPendingSignup();
    if(data.session)redirectAfterAuth();
    else{$('otpPanel').style.display='none';$('authForm').style.display='block';setMode('login');setNotice(english?'Email confirmed. Please sign in to continue.':'تم تأكيد البريد الإلكتروني. سجّل الدخول للمتابعة.','success');}
  }catch(err){setNotice(err.message||'الكود غير صحيح أو انتهت صلاحيته.');}
  finally{btn.disabled=false;}
});
$('resendOtpBtn').addEventListener('click',async()=>{
  const btn=$('resendOtpBtn');btn.disabled=true;
  try{
    const {error}=await supabaseClient.auth.resend({type:'signup',email:pendingSignupEmail});
    if(error)throw error;
    setNotice('طلبنا إعادة إرسال كود التأكيد. راجع بريدك الوارد والرسائل غير المرغوب فيها.','success');
  }catch(err){setNotice(err.message||'تعذرت إعادة إرسال الكود. حاول لاحقاً.');}
  finally{btn.disabled=false;}
});
$('signOutBtn').addEventListener('click',async()=>{
 const {error}=await supabaseClient.auth.signOut();
 if(error){setNotice(english?'Could not sign out. Please try again.':'تعذر تسجيل الخروج. حاول مرة أخرى.');return;}
 location.replace('index.html');
});
supabaseClient.auth.onAuthStateChange((event,session)=>{
 if(session && event==='SIGNED_IN' && nextPage==='checkout.html') redirectAfterAuth();
});
applyAuthLanguage();
checkSession();
</script>
</body>
</html>
