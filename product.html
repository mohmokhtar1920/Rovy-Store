<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | ROVY STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #fafafa; color: #222; }
        header { background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid #eee; }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: 2px; text-decoration: none; color: #222; }
        .logo span { color: #b58a61; }
        .product-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        @media(max-width: 768px) { .product-container { grid-template-columns: 1fr; } }
        
        .gallery-container { display: flex; flex-direction: column; gap: 10px; }
        .main-image { width: 100%; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); object-fit: cover; aspect-ratio: 3/4; }
        .thumbnails { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .thumb-img { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .thumb-img:hover, .thumb-img.active { border-color: #b58a61; }

        .product-details { display: flex; flex-direction: column; justify-content: center; }
        .product-category { color: #888; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
        .product-title { font-size: 36px; font-weight: 900; margin-bottom: 15px; }
        .product-price { font-size: 28px; color: #b58a61; font-weight: bold; margin-bottom: 20px; }
        .product-desc { color: #555; line-height: 1.8; margin-bottom: 30px; font-size: 16px; background: #f9f9f9; padding: 15px; border-radius: 8px; border-right: 3px solid #b58a61; }
        
        .options-group { margin-bottom: 20px; }
        .options-label { font-weight: bold; margin-bottom: 10px; display: block; }
        .options-list { display: flex; gap: 10px; flex-wrap: wrap; }
        .option-btn { padding: 8px 20px; border: 2px solid #ddd; background: transparent; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .option-btn.selected { border-color: #b58a61; background: #b58a61; color: white; }
        .option-btn.out-of-stock { background: #f1f1f1; color: #aaa; border-color: #eee; cursor: not-allowed; text-decoration: line-through; }

        .add-btn { background: #171717; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .add-btn:hover { background: #b58a61; }
        .add-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .success-toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #25d366; color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s; z-index: 1000; }
        .success-toast.show { bottom: 30px; }
        .whatsapp-float { position: fixed; bottom: 25px; left: 25px; background-color: #25d366; color: white; border-radius: 50px; text-align: center; font-size: 35px; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); z-index: 9999; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.3s; }
        .whatsapp-float:hover { background-color: #128c7e; transform: scale(1.1); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ROVY<span>.</span></a>
        <a href="index.html" style="text-decoration: none; color: #555; font-weight: bold;"><i class="fas fa-arrow-right"></i> العودة</a>
    </header>

    <div class="product-container" id="productContainer"><p>جاري التحميل...</p></div>
    <div class="success-toast" id="toast">تمت الإضافة للسلة!</div>
    <a href="https://wa.me/201012853009" class="whatsapp-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script>
        const SUPABASE_URL = 'https://bkjwfmjxmxgxgaxwrnsh.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_3nR3DUDrxahFNVH1j62Uow_YPexuzwb';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentProduct = null;
        let variants = [];
        let selectedSize = null;
        let selectedColor = null;
        let selectedVariantId = null;
        let cart = JSON.parse(localStorage.getItem('rovyCart')) || [];
        const productId = new URLSearchParams(window.location.search).get('id');

        async function loadProduct() {
            if(!productId) return;
            const { data: product } = await supabaseClient.from('products').select('*').eq('id', productId).single();
            if(!product) return;
            currentProduct = product;

            const { data: vars } = await supabaseClient.from('product_variants').select('*').eq('product_id', productId);
            variants = vars || [];

            renderProduct();
        }

        function renderProduct() {
            const container = document.getElementById('productContainer');
            
            // تجهيز الصور (تأمين قراءة الـ JSONB)
            let allImages = [currentProduct.image_url];
            let gallery = currentProduct.gallery_images;
            
            // لو سوبابيز رجعت الصور كنص، بنحولها لمصفوفة
            if (typeof gallery === 'string') {
                try { gallery = JSON.parse(gallery); } catch(e) { gallery = []; }
            }
            
            if (gallery && Array.isArray(gallery) && gallery.length > 0) {
                allImages = allImages.concat(gallery);
            }

            // بناء معرض الصور
            let galleryHtml = `
                <div class="gallery-container">
                    <img src="${allImages[0]}" class="main-image" id="mainImage">
                    <div class="thumbnails">
                        ${allImages.map((img, index) => `<img src="${img}" class="thumb-img ${index === 0 ? 'active' : ''}" onclick="changeImage(this, '${img}')">`).join('')}
                    </div>
                </div>
            `;

            let sizesHtml = '';
            let colorsHtml = '';
            let allSizes = [];
            let allColors = [];

            if (variants.length > 0) {
                variants.forEach(v => { if(v.size && !allSizes.includes(v.size)) allSizes.push(v.size); });
                variants.forEach(v => { if(v.color && !allColors.includes(v.color)) allColors.push(v.color); });
            }

            if(allSizes.length > 0) sizesHtml = `<div class="options-group"><span class="options-label">المقاس:</span><div class="options-list" id="sizesList"></div></div>`;
            if(allColors.length > 0) colorsHtml = `<div class="options-group"><span class="options-label">اللون:</span><div class="options-list" id="colorsList"></div></div>`;

            const descText = currentProduct.description || 'لا يوجد وصف تفصيلي لهذا المنتج.';

            container.innerHTML = `
                ${galleryHtml}
                <div class="product-details">
                    <div class="product-category">${currentProduct.category}</div>
                    <h1 class="product-title">${currentProduct.name}</h1>
                    <div class="product-price">${currentProduct.price} جنيه</div>
                    
                    <div class="product-desc">${descText}</div>
                    
                    ${sizesHtml}
                    ${colorsHtml}
                    <button class="add-btn" id="addToCartBtn" onclick="addToCart()" ${variants.length === 0 ? '' : 'disabled'}>
                        <i class="fas fa-shopping-bag"></i> أضف إلى السلة
                    </button>
                </div>
            `;

            if (variants.length > 0) renderOptions(allSizes, allColors);
            else document.getElementById('addToCartBtn').disabled = false;
        }

        function changeImage(thumb, imgUrl) {
            document.getElementById('mainImage').src = imgUrl;
            document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
        }

        function renderOptions(allSizes, allColors) {
            const sizesList = document.getElementById('sizesList');
            const colorsList = document.getElementById('colorsList');

            if (sizesList) {
                allSizes.forEach(size => {
                    const isAvailable = variants.some(v => v.size === size && v.stock > 0);
                    sizesList.innerHTML += `<button class="option-btn ${!isAvailable ? 'out-of-stock' : ''}" onclick="selectSize('${size}', event)" ${!isAvailable ? 'disabled' : ''}>${size}</button>`;
                });
            }

            if (colorsList) {
                allColors.forEach(color => {
                    const isAvailable = variants.some(v => v.color === color && v.stock > 0);
                    colorsList.innerHTML += `<button class="option-btn ${!isAvailable ? 'out-of-stock' : ''}" onclick="selectColor('${color}', event)" ${!isAvailable ? 'disabled' : ''}>${color}</button>`;
                });
            }
        }

        function selectSize(size, event) {
            selectedSize = size;
            document.querySelectorAll('#sizesList .option-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
            checkSelection();
        }

        function selectColor(color, event) {
            selectedColor = color;
            document.querySelectorAll('#colorsList .option-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');
            checkSelection();
        }

        function checkSelection() {
            const variant = variants.find(v => 
                (v.size === selectedSize || (!v.size && !selectedSize)) && 
                (v.color === selectedColor || (!v.color && !selectedColor))
            );
            const btn = document.getElementById('addToCartBtn');
            if (variant && variant.stock > 0) {
                selectedVariantId = variant.id;
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-shopping-bag"></i> أضف إلى السلة`;
            } else {
                selectedVariantId = null;
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-times"></i> غير متوفر بهذه المواصفات`;
            }
        }

        function addToCart() {
            const uniqueId = `${currentProduct.id}-${selectedVariantId || 'no-variant'}`;
            const existingItem = cart.find(item => item.cartItemId === uniqueId);
            if (existingItem) existingItem.quantity += 1;
            else {
                cart.push({ ...currentProduct, cartItemId: uniqueId, variantId: selectedVariantId, size: selectedSize || '', color: selectedColor || '', quantity: 1 });
            }
            localStorage.setItem('rovyCart', JSON.stringify(cart));
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        loadProduct();
    </script>
</body>
</html>
