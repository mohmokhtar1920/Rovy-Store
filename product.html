<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | ROVY STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #fafafa; color: #222; }
        
        header { background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; border-bottom: 1px solid #eee; }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: 2px; text-decoration: none; color: #222; }
        .logo span { color: #b58a61; }
        
        .back-btn { text-decoration: none; color: #555; font-weight: bold; }
        
        .product-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        @media(max-width: 768px) { .product-container { grid-template-columns: 1fr; } }
        
        .product-image { width: 100%; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .product-details { display: flex; flex-direction: column; justify-content: center; }
        .product-category { color: #888; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; }
        .product-title { font-size: 36px; font-weight: 900; margin-bottom: 15px; }
        .product-price { font-size: 28px; color: #b58a61; font-weight: bold; margin-bottom: 20px; }
        .product-desc { color: #555; line-height: 1.8; margin-bottom: 30px; font-size: 16px; }
        
        .add-btn { background: #171717; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .add-btn:hover { background: #b58a61; }
        
        .success-toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #25d366; color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s; z-index: 1000; }
        .success-toast.show { bottom: 30px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ROVY<span>.</span></a>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للمتجر</a>
    </header>

    <div class="product-container" id="productContainer">
        <!-- سيتم تحميل بيانات المنتج هنا -->
        <p style="text-align:center; grid-column: 1/-1;">جاري تحميل المنتج...</p>
    </div>

    <div class="success-toast" id="toast">تمت الإضافة للسلة بنجاح!</div>

    <script>
        const SUPABASE_URL = 'https://bkjwfmjxmxgxgaxwrnsh.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_3nR3DUDrxahFNVH1j62Uow_YPexuzwb';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentProduct = null;
        let cart = JSON.parse(localStorage.getItem('rovyCart')) || [];

        // جلب الـ ID من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function loadProduct() {
            if(!productId) {
                document.getElementById('productContainer').innerHTML = '<p>المنتج غير موجود</p>';
                return;
            }

            const { data, error } = await supabaseClient.from('products').select('*').eq('id', productId).single();
            
            if(error || !data) {
                document.getElementById('productContainer').innerHTML = '<p>المنتج غير موجود أو حدث خطأ</p>';
                return;
            }

            currentProduct = data;
            const container = document.getElementById('productContainer');
            
            // لو مفيش وصف في الداتابيز هنحط وصف افتراضي
            const description = data.description || 'هذا المنتج مصنوع من أجود الخامات، ويتميز بتصميم عصري يناسب جميع الأذواق. متوفر بأفضل سعر في ROVY STORE.';

            container.innerHTML = `
                <img src="${data.image_url}" class="product-image" alt="${data.name}">
                <div class="product-details">
                    <div class="product-category">${data.category}</div>
                    <h1 class="product-title">${data.name}</h1>
                    <div class="product-price">${data.price} جنيه</div>
                    <p class="product-desc">${description}</p>
                    <button class="add-btn" onclick="addToCart()">
                        <i class="fas fa-shopping-bag"></i> أضف إلى السلة
                    </button>
                </div>
            `;
        }

        function addToCart() {
            const existingItem = cart.find(item => item.id === currentProduct.id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...currentProduct, quantity: 1 });
            }
            localStorage.setItem('rovyCart', JSON.stringify(cart));
            
            // إظهار رسالة نجاح
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        loadProduct();
    </script>
</body>
</html>
